<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Sloppy</title>
		<link rel="icon" href="/favicon.png" sizes="32x32" type="image/png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="mobile-web-app-capable" content="yes" />
		<!-- iOS reads the manifest's `display` only from 16.4; the Apple pair is what
		     an older phone launches full-bleed from its home screen. -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Sloppy" />
		<script>
			// The saved look, applied before the first paint — DESIGN.md § "The look".
			var root = document.documentElement;
			var osDark = matchMedia('(prefers-color-scheme: dark)').matches;
			var saved = {};
			try {
				saved = JSON.parse(localStorage.getItem('sloppy_prefs') || '{}') || {};
			} catch (e) {
				// A browser told to block site data throws on the accessor itself.
			}
			// A look is one of Sloppy's own or one carried as data, by its id — and
			// the scheme or theme an earlier build kept is the look of that name.
			// The bound on an id is the prefs store's.
			var anId = function (value) {
				return typeof value === 'string' && /^[a-z0-9][a-z0-9-]{0,63}$/.test(value);
			};
			var own = ['paper', 'graphite', 'light', 'dark', 'contrast'];
			var look = anId(saved.look)
				? saved.look
				: anId(saved.scheme)
					? saved.scheme
					: own.indexOf(saved.theme) >= 0
						? saved.theme
						: osDark
							? 'graphite'
							: 'paper';
			var dark = look === 'graphite' || look === 'dark';
			// A look carried as data paints inline, from the copy of its tokens the
			// prefs store cached. The bound on a token and its paint is the store's,
			// `elsewhere` is the tokens another axis owns, and the two painters have
			// to agree about both.
			var paint = null;
			try {
				paint = JSON.parse(
					localStorage.getItem('sloppy_look') || localStorage.getItem('sloppy_scheme') || 'null'
				);
			} catch (e) {
				// Blocked site data again, and the look below still paints.
			}
			var elsewhere = ['--border'];
			if (paint && paint.tokens && paint.slug === look) {
				dark = paint.variant === 'dark';
				for (var token in paint.tokens) {
					var colour = paint.tokens[token];
					if (
						/^--[a-z0-9-]{1,40}$/.test(token) &&
						typeof colour === 'string' &&
						/^[^;{}]{1,96}$/.test(colour) &&
						!/url\(/i.test(colour) &&
						elsewhere.indexOf(token) < 0
					)
						root.style.setProperty(token, colour);
				}
			}
			root.setAttribute('data-look', look);
			if (saved.style && saved.style !== 'default') root.setAttribute('data-style', saved.style);
			// Several screens are drawn at once, in the order the stylesheet draws
			// them, and one name is what a build that kept only one saved.
			var asked = saved.effects || saved.effect;
			var worn = ['grain', 'dots', 'hatch', 'glow', 'crt'].filter(function (screen) {
				return typeof asked === 'string' ? asked === screen : (asked || []).indexOf(screen) >= 0;
			});
			if (worn.length) root.setAttribute('data-effect', worn.join(' '));
			// How much of each screen there is and how big it is drawn, held the way
			// the store holds them: anything else is that screen at rest. The
			// numbers an earlier build kept for the one screen it drew are every
			// screen's, since that one is whichever of them was on.
			var sizes = saved.screens && typeof saved.screens === 'object' ? saved.screens : {};
			var both = saved.screen && typeof saved.screen === 'object' ? saved.screen : {};
			var held = function (one, instead) {
				var asked = one === undefined || one === null ? instead : one;
				return typeof asked === 'number' && isFinite(asked) && asked >= 0 && asked <= 3 ? asked : 1;
			};
			['grain', 'dots', 'hatch', 'glow', 'crt'].forEach(function (screen) {
				var said = sizes[screen] && typeof sizes[screen] === 'object' ? sizes[screen] : {};
				var strength = held(said.strength, both.strength);
				var scale = held(said.scale, both.scale);
				if (strength !== 1)
					root.style.setProperty('--screen-' + screen + '-strength', String(strength));
				if (scale !== 1) root.style.setProperty('--screen-' + screen + '-scale', String(scale));
			});
			if (saved.screenReach === 'edges' || (!saved.screenReach && both.edges === true))
				root.setAttribute('data-screen-reach', 'edges');
			// The three faces, over the tokens app.css declares them at. The store
			// writes the same three from the same table of what a face this build
			// offers asks for, and the one face an earlier build kept stands in every
			// one of the three. A family nothing here ships is used if this machine
			// has it, with the role's own stack behind it.
			var shipped = {
				inter: ["'Inter'", "'Inter'", true],
				atkinson: ["'Atkinson Hyperlegible'", "'Atkinson Hyperlegible'", false],
				opendyslexic: ["'OpenDyslexic'", "'OpenDyslexic'", false],
				apple: [
					'-apple-system, BlinkMacSystemFont, system-ui',
					'ui-monospace, SFMono-Regular, Menlo',
					true
				],
				firacode: ["'Fira Code'", "'Fira Code'", true],
				cascadiacode: ["'Cascadia Code'", "'Cascadia Code'", true],
				victormono: ["'Victor Mono'", "'Victor Mono'", true],
				iosevka: ["'Iosevka'", "'Iosevka'", true]
			};
			var itsOwn = function (face) {
				return Object.prototype.hasOwnProperty.call(shipped, face) ? shipped[face] : null;
			};
			// A name is written into a declaration of its own, so anything that could
			// end that declaration, or reach off the device from inside it, is not
			// one. The bound is the prefs store's.
			var aFace = function (value, was) {
				var named = typeof value === 'string' ? value.trim() : '';
				if (named === '' || named.length > 80 || /[;{}]|url\(|\p{Cc}/iu.test(named))
					return was === undefined ? 'system' : aFace(was, undefined);
				return named;
			};
			var kept = saved.fonts && typeof saved.fonts === 'object' ? saved.fonts : {};
			var roles = [
				['ui', '--font-sans', 'var(--font-proportional)', 0],
				['heading', '--font-heading', 'var(--font-sans)', 0],
				['mono', '--font-mono', 'var(--font-monospaced)', 1]
			];
			var monoFace = 'system';
			for (var role = 0; role < roles.length; role++) {
				var face = aFace(kept[roles[role][0]], saved.font);
				if (roles[role][0] === 'mono') monoFace = face;
				if (face === 'system') continue;
				var asked = itsOwn(face);
				root.style.setProperty(
					roles[role][1],
					(asked ? asked[roles[role][3]] : '"' + face.replace(/[\\"]/g, '\\$&') + '"') +
						', ' +
						roles[role][2]
				);
			}
			// Legibility outranks alignment: a face that cannot hold its figures to
			// one width takes the addresses anyway, without their column.
			if (itsOwn(monoFace) && !itsOwn(monoFace)[2]) {
				root.style.setProperty('--font-address-figures', 'normal');
				root.style.setProperty('--font-address-features', 'normal');
			}
			// `auto` is what this device is: closer where a mouse is the only pointer.
			var density = saved.density || 'auto';
			var forAMouse =
				matchMedia('(pointer: fine)').matches && !matchMedia('(any-pointer: coarse)').matches;
			if (density === 'compact' || (density === 'auto' && forAMouse))
				root.setAttribute('data-density', 'compact');
			root.classList.toggle('dark', dark);

			// The look's own rules, under the gate `cssIsSafe` in @sloppy/types holds
			// them to, token for token: an escape, a comment and a string read in the
			// order a CSS parser meets them, then nothing left naming anywhere but the
			// look itself. The bound is the prefs store's again.
			var css = typeof saved.css === 'string' && saved.css.length <= 65536 ? saved.css : '';
			var spelledOut = function (text) {
				return text
					.replace(/\\([0-9a-fA-F]{1,6})[ \t\n]?/g, function (whole, hex) {
						var at = parseInt(hex, 16);
						return at > 0x10ffff ? '' : String.fromCodePoint(at);
					})
					.replace(/\\([\s\S])/g, '$1');
			};
			var away = false;
			var plain = spelledOut(
				css.replace(
					/\\[\s\S]|\/\*[\s\S]*?(?:\*\/|$)|"(?:\\[\s\S]|[^"\\\n])*"?|'(?:\\[\s\S]|[^'\\\n])*'?/g,
					function (token) {
						if (token.charAt(0) === '\\') return token;
						if (token.charAt(0) === '/') return ' ';
						var quote = token.charAt(0);
						var closed = token.length > 1 && token.charAt(token.length - 1) === quote;
						var text = spelledOut(closed ? token.slice(1, -1) : token.slice(1));
						if (!/^\s*data:/i.test(text) && text.indexOf('//') >= 0) away = true;
						return /^\s*data:/i.test(text) ? ' data: ' : ' x ';
					}
				)
			);
			var reaches = away || /@\s*import/i.test(plain);
			var loads = plain.match(/url\(([^)]*)\)?/gi) || [];
			for (var at = 0; at < loads.length; at++) {
				if (!/^\s*data:/i.test(loads[at].slice(4))) reaches = true;
			}
			if (css && !reaches) {
				var rules = document.createElement('style');
				rules.id = 'sloppy-look';
				rules.textContent = css;
				document.head.appendChild(rules);
			}

			// The browser's own chrome, taking the ground from app.css rather than
			// from a second copy of the palette here, and following a change of look.
			var themeColor = document.createElement('meta');
			themeColor.name = 'theme-color';
			document.head.appendChild(themeColor);
			var paintThemeColor = function () {
				var ground = getComputedStyle(root).getPropertyValue('--background').trim();
				if (ground) themeColor.content = ground;
			};
			addEventListener('DOMContentLoaded', paintThemeColor);
			addEventListener('load', paintThemeColor);
			new MutationObserver(paintThemeColor).observe(root, {
				attributeFilter: ['data-look']
			});
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
