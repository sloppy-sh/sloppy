<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Sloppy</title>
		<script>
			// The saved look, applied before the first paint — DESIGN.md § Theme. A
			// module cannot do this: it runs after the page has already painted the
			// wrong theme once.
			var root = document.documentElement;
			var osDark = matchMedia('(prefers-color-scheme: dark)').matches;
			var saved = {};
			try {
				saved = JSON.parse(localStorage.getItem('sloppy_prefs') || '{}') || {};
			} catch (e) {
				// A browser told to block site data throws on the accessor itself.
			}
			var theme = saved.theme || (osDark ? 'graphite' : 'paper');
			var dark = theme === 'graphite' || theme === 'dark';
			root.setAttribute('data-theme', theme);
			root.setAttribute('data-accent', saved.accent || 'indigo');
			if (saved.style && saved.style !== 'default') root.setAttribute('data-style', saved.style);
			root.classList.toggle('dark', dark);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
