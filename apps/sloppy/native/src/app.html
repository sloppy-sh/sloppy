<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover draws the webview under the notch and the home
		     indicator; DESIGN.md § "The four inset vars" is how surfaces clear them.
		     Page zoom is off because pinch belongs to the graph, not the document. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<script>
			// The saved look, applied before the first paint — DESIGN.md § Theme.
			var root = document.documentElement;
			var osDark = matchMedia('(prefers-color-scheme: dark)').matches;
			var saved = {};
			try {
				saved = JSON.parse(localStorage.getItem('sloppy_prefs') || '{}') || {};
			} catch (e) {
				// A browser told to block site data throws on the accessor itself.
			}
			var theme = saved.theme || (osDark ? 'graphite' : 'paper');
			var dark = theme === 'graphite' || theme === 'dark';
			// A scheme dresses the app in place of a theme, from the copy of its
			// tokens the prefs store cached — DESIGN.md § Schemes. The bound on a
			// token and its paint is the store's, `elsewhere` is the tokens another
			// axis owns, and the two painters have to agree about both.
			var dressing = null;
			try {
				dressing = JSON.parse(localStorage.getItem('sloppy_scheme') || 'null');
			} catch (e) {
				// Blocked site data again, and the theme below still paints.
			}
			var elsewhere = ['--border', '--primary', '--primary-foreground', '--primary-mark', '--ring'];
			if (dressing && dressing.tokens && saved.scheme && dressing.slug === saved.scheme) {
				theme = 'scheme';
				dark = dressing.variant === 'dark';
				root.setAttribute('data-scheme', dressing.slug);
				for (var token in dressing.tokens) {
					var paint = dressing.tokens[token];
					if (
						/^--[a-z0-9-]{1,40}$/.test(token) &&
						typeof paint === 'string' &&
						/^[^;{}]{1,96}$/.test(paint) &&
						!/url\(/i.test(paint) &&
						elsewhere.indexOf(token) < 0
					)
						root.style.setProperty(token, paint);
				}
			}
			root.setAttribute('data-theme', theme);
			root.setAttribute('data-accent', saved.accent || 'indigo');
			if (saved.style && saved.style !== 'default') root.setAttribute('data-style', saved.style);
			if (saved.font && saved.font !== 'system') root.setAttribute('data-app-font', saved.font);
			if (saved.effect && saved.effect !== 'none') root.setAttribute('data-effect', saved.effect);
			// `auto` is what this device is: closer where a mouse is the only pointer.
			var density = saved.density || 'auto';
			var forAMouse =
				matchMedia('(pointer: fine)').matches && !matchMedia('(any-pointer: coarse)').matches;
			if (density === 'compact' || (density === 'auto' && forAMouse))
				root.setAttribute('data-density', 'compact');
			root.classList.toggle('dark', dark);

			// The webview's own chrome, taking the ground from app.css rather than
			// from a second copy of the palette here, and following a change of theme.
			var themeColor = document.createElement('meta');
			themeColor.name = 'theme-color';
			document.head.appendChild(themeColor);
			var paintThemeColor = function () {
				var ground = getComputedStyle(root).getPropertyValue('--background').trim();
				if (ground) themeColor.content = ground;
			};
			addEventListener('DOMContentLoaded', paintThemeColor);
			addEventListener('load', paintThemeColor);
			new MutationObserver(paintThemeColor).observe(root, {
				attributeFilter: ['data-theme', 'data-scheme']
			});
		</script>
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
