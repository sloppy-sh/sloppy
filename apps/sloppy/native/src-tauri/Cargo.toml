[package]
name = "sloppy-native"
version = "0.0.1"
description = "Sloppy — a Zettelkasten-structured, socially-shareable knowledge graph"
authors = ["sloppy.sh"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sloppy_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
# The webview's side of the bridge, so the commands are exercised the way the
# page calls them rather than only as functions.
tauri = { version = "2.11.2", features = ["test"] }

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A `vault:` URL carries a file's whole path in one segment, so reading one back
# is a percent-decode.
percent-encoding = "2"
# Bytes cross the bridge as base64, because the bridge carries JSON.
base64 = "0.22"
# The history of the folder a graph is in is git's, and this is git — the two
# transports a folder's remotes are reached over are
# docs/ARCHITECTURE.md § "The vault's history". `ssh` is libssh2, whose crypto
# is OpenSSL's on every platform and which a phone has none of, so the crate
# builds its own on every target rather than making one a thing a machine has to
# have before it can build this app.
git2 = { version = "0.20", default-features = false, features = ["https", "ssh", "vendored-openssl"] }
# Signing a commit happens here rather than by a program, so a phone signs too —
# docs/ARCHITECTURE.md § "The vault's history".
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "alloc", "std", "getrandom"] }
# A commit's time is a count of seconds, and `Timestamp` in `@sloppy/types` is
# ISO-8601 UTC at millisecond width.
chrono = { version = "0.4", default-features = false, features = ["std", "now"] }
# What seals a key this app is given for an assistant, so the key is written
# down only as something this device can read back — docs/ARCHITECTURE.md
# § "Asking a tool to write the notes". A path while it is being built here;
# it becomes a version before this ships.
tauri-plugin-crypto-hw = { path = "vendor/tauri-plugin-crypto-hw" }
# The sign-in round trip: out through opener, back through deep-link.
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
# An identity store answers only the origins it was set up for, and a webview is
# never one of them, so what this app asks of one is asked from out here.
tauri-plugin-http = "2"
# Where a graph lives is a folder somebody picks, and an identity another device
# wrote is a file they pick.
tauri-plugin-dialog = "2"
# What somebody picked on Android is not a path, so reading it is this rather
# than std::fs.
tauri-plugin-fs = "2"
# The endpoint an agent calls Sloppy's own acts over. Blocking and
# thread-per-request, which is how everything else in this crate is written, so
# it needs no async runtime beside Tauri's and no TLS: the socket is the
# loopback, bound to a port the machine chooses.
tiny_http = "0.12"

# A program the app starts reads the project by starting programs of its own, so
# ending one signals the whole group rather than the program alone —
# docs/ARCHITECTURE.md § "Asking a tool to write the notes".
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Android's WebView reports env(safe-area-inset-bottom) as 0 for the 3-button nav
# bar, so the real WindowInsets are read natively and published as CSS vars.
# DESIGN.md § "The four inset vars".
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-safe-area-insets-css = "0.2"

# "deep-link" is what re-emits a forwarded URL through the deep-link plugin.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
