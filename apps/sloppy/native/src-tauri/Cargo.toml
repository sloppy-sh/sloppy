[package]
name = "sloppy-native"
version = "0.0.1"
description = "Sloppy — a Zettelkasten-structured, socially-shareable knowledge graph"
authors = ["sloppy.sh"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sloppy_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The sign-in round trip: out through opener, back through deep-link.
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"

# Android's WebView reports env(safe-area-inset-bottom) as 0 for the 3-button nav
# bar, so the real WindowInsets are read natively and published as CSS vars.
# DESIGN.md § "The four inset vars".
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-safe-area-insets-css = "0.2"

# "deep-link" is what re-emits a forwarded URL through the deep-link plugin.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
