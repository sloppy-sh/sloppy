[package]
name = "sloppy-native"
version = "0.0.1"
description = "Sloppy — a Zettelkasten-structured, socially-shareable knowledge graph"
authors = ["sloppy.sh"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sloppy_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
# The webview's side of the bridge, so the commands are exercised the way the
# page calls them rather than only as functions.
tauri = { version = "2.11.2", features = ["test"] }

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A `vault:` URL carries a file's whole path in one segment, so reading one back
# is a percent-decode.
percent-encoding = "2"
# Bytes cross the bridge as base64, because the bridge carries JSON.
base64 = "0.22"
# The history of the folder a graph is in is git's, and this is git. Nothing
# here fetches or pushes — docs/ARCHITECTURE.md § "The vault's history" — so the
# transports, and openssl with them, are left out.
git2 = { version = "0.20", default-features = false }
# A commit's time is a count of seconds, and `Timestamp` in `@sloppy/types` is
# ISO-8601 UTC at millisecond width.
chrono = { version = "0.4", default-features = false, features = ["std", "now"] }
# The sign-in round trip: out through opener, back through deep-link.
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"

# Android's WebView reports env(safe-area-inset-bottom) as 0 for the 3-button nav
# bar, so the real WindowInsets are read natively and published as CSS vars.
# DESIGN.md § "The four inset vars".
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-safe-area-insets-css = "0.2"

# "deep-link" is what re-emits a forwarded URL through the deep-link plugin.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Where a graph lives is a folder somebody picks. A phone and a tablet keep
# theirs in the app's own documents folder with nobody asked, so the folder
# dialog ships to a desktop only.
tauri-plugin-dialog = "2"
