[package]
name = "tauri-plugin-speech"
version = "0.1.0"
authors = [ "SoSweetHam <sosweetham@gmail.com>" ]
license = "MIT"
description = "The computer's own speech recognition, for Tauri"
edition = "2021"
rust-version = "1.87.0"
links = "tauri-plugin-speech"

[dependencies]
tauri = { version = "2.5.0" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
base64 = "0.22"
getrandom = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSError", "NSLocale", "NSObject", "NSOperation", "NSString", "NSURL", "NSValue"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioRecorder", "AVAudioSettings"] }
objc2-speech = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "SFSpeechRecognizer",
    "SFSpeechRecognitionRequest",
    "SFSpeechRecognitionResult",
    "SFSpeechRecognitionTask",
    "SFTranscription",
] }

[build-dependencies]
tauri-plugin = { version = "2.2.0", features = ["build"] }
