# Dev backing services only — the database and the object store. The API and the
# clients run on the host (`pnpm dev`), and the native app always does. Nothing
# here needs a .env: every value has a dev default, so a fresh clone comes up with
# `docker compose up -d`.
#
# Every published port is overridable and offset from syr's own dev stack, which
# uses 8000 / 8333 / 9001 / 8091. Verifying Platform Delegation means running
# both stacks at once, so the defaults must not collide.

services:
  # SurrealDB v3 — Sloppy's own store: nodes, addresses, labels, blocks, ink.
  # Identity and blobs live in syr and are never written here.
  # RocksDB is the proven on-disk backend; SurrealKV is the newer alternative
  # (swap to surrealkv://data if preferred).
  surrealdb:
    container_name: sloppy-surrealdb
    image: surrealdb/surrealdb:v3.1.3
    command: >
      start --log info
      --username ${SURREALDB_USER:-root}
      --password ${SURREALDB_PASS:-sloppy-dev-password}
      rocksdb://data
    ports:
      - "${SURREALDB_PORT:-8010}:8000"
    volumes:
      - ./db/data:/data
    healthcheck:
      # The v3 image is distroless: no /bin/sh, so a CMD-SHELL probe fails with
      # "stat /bin/sh: no such file or directory" and the service never leaves
      # `starting`. Exec form, and the bundled binary is the only probe in there.
      test:
        ["CMD", "/surreal", "isready", "--endpoint", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # S3-compatible object storage. MinIO because syr runs MinIO and Sloppy hands
  # its blobs to syr: one S3 implementation across both stacks keeps a
  # presign → PUT → complete round trip meaning the same thing on each side.
  #
  # Sloppy's own blobs (a raster of an ink stroke before it is handed to syr, an
  # export) land here; a published node's media goes to syr, not to this bucket.
  # No API exists yet; when it lands it creates the bucket on startup and keeps
  # every object private, handing out short-lived presigned URLs. CORS is set
  # here because community MinIO only honours the env var.
  minio:
    container_name: sloppy-minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-sloppy-access-key}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-sloppy-secret-key}
      # tauri://localhost and http://tauri.localhost are the native shell's own
      # origins; a webview PUT fails CORS without them.
      MINIO_API_CORS_ALLOW_ORIGIN: ${S3_CORS_ORIGINS:-http://localhost:5173,tauri://localhost,http://tauri.localhost}
    ports:
      - "${S3_PORT:-9010}:9000"
      - "${S3_CONSOLE_PORT:-9011}:9001"
    volumes:
      - ./s3/data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
